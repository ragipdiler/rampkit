name: Bug report
description: Report a reproducible problem in Rampkit.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include credentials or private URLs. Report security issues privately using SECURITY.md."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the input format and a minimal public or synthetic example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node version, and Rampkit commit/version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or sanitized logs
